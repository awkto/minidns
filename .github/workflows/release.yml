name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test ./...

      - name: Build minidns
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.meta.outputs.tag }}" \
            -o minidns-linux-${{ matrix.goarch }} ./cmd/minidns

      - name: Build deb
        run: |
          bash scripts/build-deb.sh "${{ steps.meta.outputs.tag }}" \
            "${{ matrix.goarch }}" "minidns-linux-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: minidns-${{ matrix.goarch }}
          path: |
            minidns-linux-${{ matrix.goarch }}
            *.deb

  # a release must pass the same fresh-install and upgrade tests as CI, on
  # both supported baselines, with the exact deb that will be published
  e2e:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:24.04', runner: ubuntu-latest, arch: amd64 }
          - { image: 'debian:12', runner: ubuntu-latest, arch: amd64 }
          - { image: 'debian:12', runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minidns-${{ matrix.arch }}
      - name: end-to-end (fresh install)
        run: docker run --rm -v "$PWD:/work" ${{ matrix.image }} bash /work/scripts/e2e.sh
      - name: upgrade from the previous release
        run: docker run --rm -v "$PWD:/work" ${{ matrix.image }} bash /work/scripts/upgrade-test.sh

  release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x artifacts/minidns-linux-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/minidns-linux-*
            artifacts/*.deb
