name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build deb
        env:
          CGO_ENABLED: '0'
        run: |
          # 99.x so the upgrade test really is an upgrade from any release
          go build -trimpath -ldflags "-s -w -X main.version=v99.0.0-ci${{ github.run_number }}" -o minidns-linux-amd64 ./cmd/minidns
          bash scripts/build-deb.sh 99.0.0~ci${{ github.run_number }} amd64 minidns-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: '*.deb'

  # The two supported baselines: Ubuntu 24.04 (unbound 1.19) and Debian 12
  # (unbound 1.17). Each gets a fresh-install run and an upgrade from the
  # previous release.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: end-to-end (fresh install)
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }} # optional: replica checks skip without it
        run: docker run --rm -v "$PWD:/work" -e DIGITALOCEAN_TOKEN ${{ matrix.image }} bash /work/scripts/e2e.sh
      - name: upgrade from the previous release
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: docker run --rm -v "$PWD:/work" -e DIGITALOCEAN_TOKEN ${{ matrix.image }} bash /work/scripts/upgrade-test.sh
