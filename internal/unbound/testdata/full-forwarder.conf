# Generated by minidns — do not edit; run `minidns apply` after changing
# {PREFIX}/etc/minidns/config.yaml
server:
  interface: 0.0.0.0
  port: 53
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  chroot: ""
  username: unbound
  do-ip6: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  aggressive-nsec: yes

  # performance
  num-threads: 4
  msg-cache-size: 64m
  rrset-cache-size: 128m
  msg-cache-slabs: 4
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-slabs: 4
  outgoing-range: 4096
  num-queries-per-thread: 2048
  so-reuseport: yes
  prefetch: yes
  prefetch-key: yes

  # keep answering from cache when upstream/ISP is down
  serve-expired: yes
  serve-expired-ttl: 86400

  # RPZ needs the respip module
  module-config: "respip validator iterator"


  # CA bundle to validate DoT upstream certificates
  tls-cert-bundle: "{PREFIX}/ca.crt"

  # statistics for `minidns stats` / the prometheus exporter
  extended-statistics: yes
  statistics-cumulative: no

  # query logging (epoch timestamps; `minidns logs` renders them)
  logfile: "{PREFIX}/var/log/minidns/unbound.log"
  log-time-ascii: no
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  log-local-actions: yes
  val-log-level: 1

rpz:
  name: allow.rpz.minidns.
  zonefile: "{PREFIX}/var/lib/minidns/rpz/allow.rpz"
  rpz-log: yes
  rpz-log-name: allow

rpz:
  name: block.rpz.minidns.
  zonefile: "{PREFIX}/var/lib/minidns/rpz/block.rpz"
  rpz-log: yes
  rpz-log-name: block

rpz:
  name: adblock-oisd.rpz.minidns.
  zonefile: "{PREFIX}/var/lib/minidns/rpz/adblock-oisd.rpz"
  rpz-log: yes
  rpz-log-name: adblock-oisd

rpz:
  name: adblock-stevenblack.rpz.minidns.
  zonefile: "{PREFIX}/var/lib/minidns/rpz/adblock-stevenblack.rpz"
  rpz-log: yes
  rpz-log-name: adblock-stevenblack

auth-zone:
  name: "dnsif.ca."
  zonefile: "{PREFIX}/var/lib/minidns/zones/dnsif.ca.zone"
  for-downstream: yes
  for-upstream: yes
  fallback-enabled: no

forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 9.9.9.9@853#dns.quad9.net
  forward-addr: 10.0.0.1@853
  forward-addr: 10.0.0.2@5353

remote-control:
  control-enable: yes
  control-interface: /run/unbound.control
