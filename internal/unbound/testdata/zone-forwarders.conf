# Generated by minidns — do not edit; run `minidns apply` after changing
# {PREFIX}/etc/minidns/config.yaml
server:
  interface: 0.0.0.0
  interface: ::0
  port: 53
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: ::1/128 allow
  access-control: fc00::/7 allow
  access-control: fe80::/10 allow
  chroot: ""
  username: unbound
  do-ip6: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  aggressive-nsec: yes

  # performance
  num-threads: 4
  msg-cache-size: 64m
  rrset-cache-size: 128m
  msg-cache-slabs: 4
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-slabs: 4
  outgoing-range: 4096
  num-queries-per-thread: 2048
  so-reuseport: yes
  prefetch: yes
  prefetch-key: yes

  # keep answering from cache when upstream/ISP is down
  serve-expired: yes
  serve-expired-ttl: 86400

  # RPZ needs the respip module
  module-config: "respip validator iterator"


  # CA bundle to validate DoT upstream certificates
  tls-cert-bundle: "{PREFIX}/ca.crt"

  # statistics for `minidns stats` / the prometheus exporter
  extended-statistics: yes
  statistics-cumulative: no

  # query logging (epoch timestamps; `minidns logs` renders them)
  logfile: "{PREFIX}/var/log/minidns/unbound.log"
  log-time-ascii: no
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  log-local-actions: yes
  val-log-level: 1

  # a forwarder on this host (e.g. a local DoH/DNSCrypt proxy)
  do-not-query-localhost: no

  # zones forwarded to their own servers
  local-zone: "30.10.in-addr.arpa." transparent
  domain-insecure: "30.10.in-addr.arpa."
  local-zone: "corp.example." transparent
  domain-insecure: "corp.example."

forward-zone:
  name: "30.10.in-addr.arpa."
  forward-tls-upstream: yes
  forward-addr: 10.30.0.53@853

forward-zone:
  name: "corp.example."
  forward-addr: 10.20.0.53
  forward-addr: 127.0.0.1@5353

remote-control:
  control-enable: yes
  control-interface: /run/unbound.control
